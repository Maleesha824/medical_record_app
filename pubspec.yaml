name: medical_record_app
description: Personal medical records, medicine reminders and health tracking app.
publish_to: "none"
version: 2.0.0+2

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  fl_chart: ^1.0.0
  intl: ^0.20.2
  pdf: ^3.12.0
  printing: ^5.14.3
  shared_preferences: ^2.5.3
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
